<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .blank-input { width: 80px; display: inline-block; margin: 0 5px; border-bottom: 1px solid #000; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">📝 Exam Viewer</h1>
    <div id="examContainer"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const examId = urlParams.get('examId');

    if (!examId) {
      document.getElementById('examContainer').innerHTML = '<div class="alert alert-danger">Missing examId in URL</div>';
    } else {
      fetch(`exams/${examId}.exm`)
        .then(res => {
          if (!res.ok) throw new Error('Exam not found');
          return res.json();
        })
        .then(data => renderExam(data))
        .catch(err => {
          document.getElementById('examContainer').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
        });
    }

    function renderExam(exam) {
      const container = document.getElementById('examContainer');
      container.innerHTML = `
        <h3>${exam.exam_name || 'Untitled Exam'}</h3>
        <p><strong>Time Limit:</strong> ${exam.time_limit_minutes} minutes</p>
      `;

      exam.categories.forEach((cat, ci) => {
        const catDiv = document.createElement('div');
        catDiv.className = 'mb-4';
        catDiv.innerHTML = `<h4>${cat.name}</h4>`;
        
        cat.questions.forEach((q, qi) => {
          const qDiv = document.createElement('div');
          qDiv.className = 'card mb-3';
          qDiv.innerHTML = `<div class="card-header"><strong>Q${qi + 1}:</strong> ${renderQuestionText(q)}</div>`;

          const body = document.createElement('div');
          body.className = 'card-body';

          switch (q.type) {
            case 'multiple_choice':
              q.options.forEach((opt, i) => {
                const id = `q${ci}-${qi}-opt${i}`;
                body.innerHTML += `
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="q${ci}-${qi}" id="${id}">
                    <label class="form-check-label" for="${id}">${opt}</label>
                  </div>`;
              });
              break;

            case 'multiple_select':
              q.options.forEach((opt, i) => {
                const id = `q${ci}-${qi}-opt${i}`;
                body.innerHTML += `
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="q${ci}-${qi}" id="${id}">
                    <label class="form-check-label" for="${id}">${opt}</label>
                  </div>`;
              });
              break;

            case 'short_answer':
              body.innerHTML += `<input type="text" class="form-control" placeholder="Your answer">`;
              break;

            case 'true_false':
              body.innerHTML += `
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="q${ci}-${qi}" id="tf-true-${ci}-${qi}">
                  <label class="form-check-label" for="tf-true-${ci}-${qi}">True</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="q${ci}-${qi}" id="tf-false-${ci}-${qi}">
                  <label class="form-check-label" for="tf-false-${ci}-${qi}">False</label>
                </div>`;
              break;

            case 'fill_in_blank':
              body.innerHTML += renderFillInBlank(q);
              break;

            case 'matching':
              q.pairs.forEach((pair, i) => {
                body.innerHTML += `
                  <div class="mb-2">
                    <strong>${pair.left}</strong>
                    <select class="form-select mt-1">
                      <option value="">Select match</option>
                      ${q.pairs.map(p => `<option>${p.right}</option>`).join('')}
                    </select>
                  </div>`;
              });
              break;

            case 'ordering':
              q.options.forEach(opt => {
                body.innerHTML += `
                  <div class="mb-1">
                    <input class="form-control" value="${opt}" readonly>
                  </div>`;
              });
              break;

            case 'essay':
              body.innerHTML += `<textarea class="form-control" rows="5" placeholder="Write your essay (Max ${q.max_length_words} words)"></textarea>`;
              break;

            default:
              body.innerHTML += `<em>Unknown question type</em>`;
          }

          qDiv.appendChild(body);
          catDiv.appendChild(qDiv);
        });

        container.appendChild(catDiv);
      });
    }

    function renderQuestionText(q) {
      if (q.type === 'fill_in_blank') {
        return q.question.replace(/\[\[(blank_\d+)\]\]/g, `<input type="text" class="blank-input" placeholder="...">`);
      }
      return q.question;
    }
  </script>
</body>
</html>
